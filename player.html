            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;

        // Fonksyon pou jwenn enfòmasyon yon film selon id li
        function findMovieById(id) {
            // Kolekte tout fim nan yon sèl lis
            let allMovies = [];
            
            if (data.data && data.data.operatingList) {
                data.data.operatingList.forEach(op => {
                    if (op.type === 'BANNER' && op.banner && op.banner.items) {
                        op.banner.items.forEach(item => {
                            if (item.subject) {
                                allMovies.push(item.subject);
                            }
                        });
                    }
                    
                    if (op.type === 'SUBJECTS_MOVIE' && op.subjects) {
                        allMovies = allMovies.concat(op.subjects);
                    }
                });
            }

            // Recheche film la
            return allMovies.find(movie => movie.subjectId == id);
        }

        // Fonksyon pou montre paj player an
        function displayPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const movieId = urlParams.get('id');
            const container = document.getElementById('player-content');
            
            if (!movieId) {
                container.innerHTML = '<div class="not-found">Pa gen id film nan URL la.</div>';
                return;
            }

            const movie = findMovieById(movieId);

            if (!movie) {
                container.innerHTML = '<div class="not-found">Fim nan pa jwenn nan done yo.</div>';
                return;
            }

            // Ane a soti nan releaseDate
            const year = movie.releaseDate ? new Date(movie.releaseDate).getFullYear() : 'Ane enkoni';
            const genre = movie.genre ? movie.genre.split(',')[0] : 'Jenerik';
            const country = movie.countryName || 'Peyi enkoni';
            const imdbRating = movie.imdbRatingValue || 'N/A';
            const description = movie.description || 'Pa gen deskripsyon.';
            const title = movie.title || 'Sans Tit';
            const coverUrl = movie.cover?.url || '';
            
            // Kreye HTML pou paj player an
            const html = `
                <div class="player-section">
                    <div class="player-placeholder">
                        <div class="play-icon" onclick="alert('Fonksyon jwe videyo pa disponib nan demonstrasyon sa a.')">▶</div>
                        <h2 style="margin-bottom: 10px;">${title}</h2>
                        <p style="color: #aaa;">Klike sou bouton an pou "jwe" film nan.</p>
                    </div>
                </div>

                <div class="movie-info-detailed">
                    <div style="display: flex; gap: 30px; flex-wrap: wrap;">
                        ${coverUrl ? `<img src="${coverUrl}" alt="${title}" style="width: 200px; border-radius: 8px; object-fit: cover;" onerror="this.style.display='none'">` : ''}
                        <div style="flex: 1;">
                            <div class="movie-title-large">${title}</div>
                            <div class="movie-meta-large">
                                <span>${year}</span>
                                <span>•</span>
                                <span>${genre}</span>
                                <span>•</span>
                                <span>${country}</span>
                                <span class="imdb-large">IMDb ${imdbRating}</span>
                            </div>
                            <div class="description-large">
                                ${description}
                            </div>
                            <div style="margin-top: 20px;">
                                <button class="back-button" onclick="window.location.href='index.html'">Retounen nan Akèy</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        window.onload = displayPlayer;
    </script>
