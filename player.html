<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Player - HandyFlix</title>
    
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/jpeg" href="#">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Watch movies and series online">
    <meta name="theme-color" content="#e50914">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
        }

        .player-page {
            min-height: 100vh;
            background: #000;
        }

        .player-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 15px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-back {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .player-title {
            font-size: 16px;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .player-content {
            position: relative;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .plyr {
            height: 100%;
        }

        /* Loading Overlay */
        .plyr-loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .plyr-loading-spinner {
            text-align: center;
        }

        .spinner-circle {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(229, 9, 20, 0.3);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        .loading-text {
            color: #fff;
            font-size: 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Movie Info Section */
        .movie-info-section {
            padding: 20px;
            background: #111;
        }

        .movie-title-large {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .movie-meta {
            display: flex;
            gap: 15px;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .imdb-badge {
            background: #f5c518;
            color: #000;
            padding: 3px 10px;
            border-radius: 5px;
            font-weight: 600;
        }

        .movie-description {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .movie-extra {
            display: flex;
            gap: 15px;
            color: #888;
            font-size: 14px;
            flex-wrap: wrap;
        }

        .extra-item {
            background: #1f1f1f;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        /* Similar Movies */
        .related-section {
            padding: 20px;
            border-top: 1px solid #222;
        }

        .related-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #fff;
        }

        .movies-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .related-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .related-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background: #2a2a2a;
            position: relative;
        }

        .related-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .related-info {
            padding: 8px;
        }

        .related-info h4 {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .back-home {
            display: block;
            text-align: center;
            padding: 15px;
            color: #e50914;
            text-decoration: none;
            font-weight: 500;
            margin-top: 20px;
        }

        .not-found {
            text-align: center;
            padding: 60px 20px;
        }

        .not-found i {
            font-size: 50px;
            color: #e50914;
            margin-bottom: 20px;
        }

        .not-found h3 {
            margin-bottom: 20px;
            color: #aaa;
        }

        .not-found a {
            color: #e50914;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="player-page">
        <div class="player-header">
            <a href="javascript:history.back()" class="player-back">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="player-title" id="player-title">Loading...</div>
        </div>
        
        <div class="player-content">
            <!-- Loading Overlay -->
            <div class="plyr-loading-overlay" id="loading-overlay" style="display: none;">
                <div class="plyr-loading-spinner">
                    <div class="spinner-circle"></div>
                    <div class="loading-text">Loading video...</div>
                </div>
            </div>
            
            <!-- Plyr Video Player -->
            <div class="video-container">
                <video id="player" playsinline controls>
                    <source src="#" type="video/mp4">
                </video>
            </div>
        </div>
        
        <!-- Movie Info (will be filled by JS) -->
        <div class="movie-info-section" id="movie-info">
            <!-- Info goes here -->
        </div>
        
        <!-- Similar Movies -->
        <div class="related-section">
            <h3 class="related-title">You might also like</h3>
            <div class="movies-row" id="similar-movies">
                <!-- Similar movies will be loaded here -->
            </div>
            
            <a href="index.html" class="back-home">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

        // Fonksyon pou jwenn tout fim
        function getAllMovies() {
            let movies = [];
            
            if (data.data && data.data.operatingList) {
                data.data.operatingList.forEach(op => {
                    if (op.type === 'BANNER' && op.banner && op.banner.items) {
                        op.banner.items.forEach(item => {
                            if (item.subject) {
                                movies.push(item.subject);
                            }
                        });
                    }
                    
                    if (op.type === 'SUBJECTS_MOVIE' && op.subjects) {
                        movies = movies.concat(op.subjects);
                    }
                });
            }
            
            // Retire doublon
            const unique = [];
            const ids = new Set();
            movies.forEach(m => {
                if (!ids.has(m.subjectId)) {
                    unique.push(m);
                    ids.add(m.subjectId);
                }
            });
            
            return unique;
        }

        // Jwenn ID fim nan nan URL
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');
        
        // Jwenn enfòmasyon fim nan
        const allMovies = getAllMovies();
        const currentMovie = allMovies.find(m => m.subjectId == movieId);

        // Inisyalize eleman DOM
        const playerTitle = document.getElementById('player-title');
        const loadingOverlay = document.getElementById('loading-overlay');
        const movieInfoDiv = document.getElementById('movie-info');
        const similarDiv = document.getElementById('similar-movies');
        const playerElement = document.getElementById('player');

        if (!currentMovie) {
            // Si pa gen fim, montre mesaj
            document.querySelector('.player-content').innerHTML = `
                <div class="not-found">
                    <i class="fas fa-film"></i>
                    <h3>Movie not found</h3>
                    <a href="index.html">← Back to Home</a>
                </div>
            `;
            movieInfoDiv.style.display = 'none';
        } else {
            // Mete tit
            playerTitle.textContent = currentMovie.title;
            
            // Montre loading
            loadingOverlay.style.display = 'flex';
            
            // Konfigire Plyr
            const player = new Plyr(playerElement, {
                controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'],
                settings: ['speed', 'quality'],
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
                quality: { default: 720, options: [1080, 720, 480, 360] }
            });
            
            // Simulation video source (replace with actual video URL)
            player.source = {
                type: 'video',
                title: currentMovie.title,
                sources: [{
                    src: 'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_1MB.mp4', // Sample video
                    type: 'video/mp4',
                    size: 1080
                }],
                poster: currentMovie.cover?.url || ''
            };
            
            // Kache loading lè video pare
            player.on('ready', () => {
                loadingOverlay.style.display = 'none';
            });
            
            player.on('error', () => {
                loadingOverlay.style.display = 'none';
                alert('Video cannot be loaded. Using demo video.');
            });
            
            // Afiche enfòmasyon fim nan
            const year = currentMovie.releaseDate ? new Date(currentMovie.releaseDate).getFullYear() : 'N/A';
            const genre = currentMovie.genre || 'N/A';
            const country = currentMovie.countryName || 'Unknown';
            const imdb = currentMovie.imdbRatingValue || 'N/A';
            const desc = currentMovie.description || 'No description available.';
            const subs = currentMovie.subtitles || 'Not specified';
            
            movieInfoDiv.innerHTML = `
                <div class="movie-title-large">${currentMovie.title}</div>
                <div class="movie-meta">
                    <span>${year}</span>
                    <span>•</span>
                    <span>${genre.split(',')[0]}</span>
                    <span>•</span>
                    <span>${country}</span>
                    <span class="imdb-badge">IMDb ${imdb}</span>
                </div>
                <div class="movie-description">${desc}</div>
                <div class="movie-extra">
                    <span class="extra-item"><i class="fas fa-closed-captioning"></i> ${subs}</span>
                    <span class="extra-item"><i class="fas fa-calendar"></i> ${currentMovie.releaseDate || 'Unknown'}</span>
                </div>
            `;
            
            // Afiche fim similè
            const otherMovies = allMovies.filter(m => m.subjectId != movieId).slice(0, 6);
            
            if (otherMovies.length > 0) {
                similarDiv.innerHTML = '';
                otherMovies.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'related-card';
                    card.onclick = () => {
                        window.location.href = `player.html?id=${m.subjectId}`;
                    };
                    card.innerHTML = `
                        <div class="related-poster">
                            <img src="${m.cover?.url || ''}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/120x180?text=No+Image'">
                        </div>
                        <div class="related-info">
                            <h4>${m.title}</h4>
                        </div>
                    `;
                    similarDiv.appendChild(card);
                });
            } else {
                similarDiv.innerHTML = '<p style="color: #666;">No similar movies found.</p>';
            }
        }
    </script>
