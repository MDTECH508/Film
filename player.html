        }

        .player-header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 20px;
            background: linear-gradient(180deg, #000 0%, rgba(0,0,0,0.9) 100%);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-back {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .player-title {
            font-size: 18px;
            font-weight: 500;
        }

        /* Video Placeholder */
        .video-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .video-placeholder::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
        }

        .play-button-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            cursor: pointer;
            position: relative;
            z-index: 10;
            transition: transform 0.2s;
            border: 3px solid rgba(255,255,255,0.3);
        }

        .play-button-large:hover {
            transform: scale(1.1);
        }

        .video-title {
            position: relative;
            z-index: 10;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            padding: 0 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .video-subtitle {
            position: relative;
            z-index: 10;
            color: #aaa;
            font-size: 16px;
        }

        .movie-info-section {
            padding: 25px 20px;
            background: #111;
            border-bottom: 1px solid #222;
        }

        .movie-title-large {
            font-size: 26px;
            font-weight: 700;

        }

        .movie-meta {
            display: flex;
            gap: 15px;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .imdb-badge {
            background: #f5c518;
            color: #000;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        .movie-description {
            color: #ccc;
            line-height: 1.7;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .movie-extra {
            display: flex;
            gap: 15px;
            color: #888;
            font-size: 14px;
            flex-wrap: wrap;
        }

        .extra-item {
            background: #1f1f1f;
            padding: 6px 15px;
            border-radius: 30px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .extra-item i {
            color: #e50914;
        }

        /* OneRoom Button */
        .oneroom-button {
            display: inline-block;
            background: #e50914;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 15px;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .oneroom-button:hover {
            background: #f40612;
        }

        .oneroom-button i {
            margin-right: 8px;
        }

            padding: 25px 20px;
        }

        .related-title {
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .related-title i {
            color: #e50914;
        }

        .movies-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .related-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #2a2a2a;
        }

        }

        }

        .related-poster img {

        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');
        
        // Jwenn enfòmasyon fim nan
        const currentMovie = allMovies.find(m => m.subjectId == movieId);

        // Si pa gen fim, montre mesaj
        if (!currentMovie) {
            document.body.innerHTML = `
                <div class="not-found">
                    <i class="fas fa-film"></i>
                    <h3>Fim pa jwenn</h3>
                    <p style="color:#666; margin-bottom:20px;">ID: ${movieId || 'pa gen ID'}</p>
                    <a href="index.html">← Retounen nan akèy</a>
                </div>
            `;
        } else {
            // Mete tit nan header
            document.getElementById('player-title').textContent = currentMovie.title;
            
            // Mete imaj background
            const placeholder = document.getElementById('videoPlaceholder');
            if (currentMovie.cover?.url) {
                placeholder.style.backgroundImage = `url('${currentMovie.cover.url}')`;
            }
            
            // Mete tit sou placeholder
            document.getElementById('videoTitle').textContent = currentMovie.title;
            document.getElementById('videoSubtitle').innerHTML = '<i class="fas fa-external-link-alt"></i> Klike pou wouvè sou OneRoom';
            
            // Jere klike sou bouton jwe - Ouvè lyen OneRoom
            document.getElementById('playButton').addEventListener('click', function() {
                if (currentMovie.oneroomUrl) {
                    window.open(currentMovie.oneroomUrl, '_blank');
                } else {
                    alert('Lyen OneRoom pa disponib pou fim sa a.');
                }
            });
            
            // Afiche enfòmasyon fim nan
            const year = currentMovie.releaseDate ? new Date(currentMovie.releaseDate).getFullYear() : 'N/A';
            const genre = currentMovie.genre || 'Jenerik';
            const country = currentMovie.countryName || 'Peyi enkoni';
            const imdb = currentMovie.imdbRatingValue || 'N/A';
            const desc = currentMovie.description || 'Pa gen deskripsyon disponib.';
            const subs = currentMovie.subtitles || 'Pa presize';
            
            document.getElementById('movieInfo').innerHTML = `
                <div class="movie-title-large">${currentMovie.title}</div>
                <div class="movie-meta">
                    <span>${year}</span>
                    <span>•</span>
                    <span>${genre.split(',')[0]}</span>
                    <span>•</span>
                    <span>${country}</span>
                    <span class="imdb-badge">IMDb ${imdb}</span>
                </div>
                <div class="movie-description">${desc}</div>
                <div class="movie-extra">
                    <span class="extra-item"><i class="fas fa-closed-captioning"></i> ${subs.substring(0, 30)}${subs.length > 30 ? '...' : ''}</span>
                    <span class="extra-item"><i class="fas fa-calendar-alt"></i> ${currentMovie.releaseDate || 'Dat enkoni'}</span>
                </div>
                <a href="${currentMovie.oneroomUrl || '#'}" target="_blank" class="oneroom-button">
                    <i class="fas fa-play"></i> Gade sou OneRoom
                </a>
            `;
            
            // Afiche fim similè (lòt fim)
            const otherMovies = allMovies.filter(m => m.subjectId != movieId).slice(0, 6);
            const similarDiv = document.getElementById('similarMovies');
            
            if (otherMovies.length > 0) {
                similarDiv.innerHTML = '';
                otherMovies.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'related-card';
                    card.onclick = () => {
                        window.location.href = `player.html?id=${m.subjectId}`;
                    };
                    
                    const mYear = m.releaseDate ? new Date(m.releaseDate).getFullYear() : '';
                    
                    card.innerHTML = `
                        <div class="related-poster">
                            <img src="${m.cover?.url || ''}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/130x195?text=No+Image'">
                        </div>
                        <div class="related-info">
                            <h4>${m.title}</h4>
                            <p>${mYear}</p>
                        </div>
                    `;
                    similarDiv.appendChild(card);
                });
            } else {
                similarDiv.innerHTML = '<p style="color: #666;">Pa gen lòt fim pou kounye a.</p>';
            }
        }
